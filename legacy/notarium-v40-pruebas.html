<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E6ECEE; --paper:#FFFFFF; --ink:#1C2630; --muted:#66737D; --line:#D3DBDF;
  --scrub:#0F6B63; --scrub-tint:#E3F1EF; --strike:#A6B0B7; --custom:#6A4AB5; --custom-tint:#F1ECFB;
  --amber:#A86A12; --amber-tint:#FBF1DF; --warn:#B42318; --warn-tint:#FCE9E7;
  --side:#F4F7F8;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --note:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#11171A; --paper:#1A2226; --ink:#E3EAEE; --muted:#93A1AA; --line:#2C373D;
    --scrub:#55C3B5; --scrub-tint:#16312E; --strike:#56636B; --custom:#B39DF0; --custom-tint:#251F36;
    --amber:#E3A84B; --amber-tint:#33281A; --warn:#F2877C; --warn-tint:#3A1F1C; --side:#151C20;
  }
}
:root[data-theme="dark"]{
  --desk:#11171A; --paper:#1A2226; --ink:#E3EAEE; --muted:#93A1AA; --line:#2C373D;
  --scrub:#55C3B5; --scrub-tint:#16312E; --strike:#56636B; --custom:#B39DF0; --custom-tint:#251F36;
  --amber:#E3A84B; --amber-tint:#33281A; --warn:#F2877C; --warn-tint:#3A1F1C; --side:#151C20;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px;border-radius:3px}

.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand-row{display:flex;align-items:baseline;justify-content:space-between;margin:0 8px 14px}
.brand{font-family:var(--note);font-size:26px;font-weight:600;letter-spacing:-.01em}
.close-pick{display:none;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 10px;font-size:14px}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;font-size:15px}
.search::placeholder{color:var(--muted)}
.group-name{font-size:13px;color:var(--muted);margin:18px 8px 4px;font-weight:700}
.tpl-row{display:flex;align-items:center;border-radius:6px}
.tpl-row:hover{background:var(--paper)}
.tpl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;text-align:left;background:none;border:0;border-radius:6px;padding:7px 4px 7px 8px;font-size:14.5px}
.tpl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl .code{font-size:12px;color:var(--muted);margin-left:auto;flex-shrink:0}
.tpl-row.cur{background:var(--scrub-tint)}
.tpl-row.cur .tpl{color:var(--scrub);font-weight:700}
.tpl-row.cur .code{color:var(--scrub)}
.star{border:0;background:none;color:var(--line);font-size:16px;padding:4px 8px;line-height:1}
.tpl-row:hover .star{color:var(--muted)}
.star[aria-pressed="true"]{color:var(--amber)}
.empty-q{color:var(--muted);font-size:14px;margin:14px 8px}
.create{margin:20px 0 0;width:100%;border:1px dashed var(--scrub);background:none;color:var(--scrub);border-radius:8px;padding:9px;font-weight:700}
.create:hover{background:var(--scrub-tint)}
.create.alt{margin-top:8px;border-color:var(--custom);color:var(--custom)}
.create.alt:hover{background:var(--custom-tint)}
.side-foot{margin:auto 8px 0;padding-top:22px;font-size:12.5px;color:var(--muted)}

main{padding:0 28px 60px;min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 0 12px;max-width:880px;margin:0 auto}
.bar h1{font-size:18px;margin:0;font-weight:700;min-width:0}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 12px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--scrub);color:var(--scrub);background:var(--scrub-tint)}
.btn.primary{background:var(--scrub);border-color:var(--scrub);color:var(--paper);font-weight:700}
.btn.danger{color:var(--warn);border-color:var(--warn);background:none}
.btn.mob{display:none}
.pending{font-size:13.5px;color:var(--amber);padding:0 4px}
.pending.done{color:var(--scrub)}

.sheet{max-width:880px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:34px 64px 40px 46px;box-shadow:0 1px 0 var(--line)}
.sec{margin:0 0 22px}
.sec-head{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.sec-head .rule{flex:1;height:1px;background:var(--line)}
.toggle{border:1px solid var(--line);background:none;border-radius:20px;font-size:12px;padding:2px 10px;font-weight:400;color:var(--muted)}
.toggle:hover{border-color:var(--muted);color:var(--ink)}
.sec.off .sec-head{opacity:.7}
.sec.off .sec-title{text-decoration:line-through}
.par{position:relative}
.par p{font-family:var(--note);font-size:17px;line-height:1.75;margin:0 0 10px;max-width:72ch;white-space:pre-line}
.par strong{font-weight:600}
.par-tools{position:absolute;right:-50px;top:2px;display:flex;flex-direction:column;gap:2px}
.par-x{border:0;background:none;color:var(--muted);padding:4px;border-radius:5px;opacity:.3;line-height:0}
.par:hover .par-x,.par-x:focus-visible{opacity:1}
.par-x[data-pedit]:hover{color:var(--custom);background:var(--custom-tint)}
.ptxt{display:block;width:100%;max-width:72ch;font-family:var(--note);font-size:17px;line-height:1.75;border:1px dashed var(--custom);background:var(--paper);padding:4px 8px;margin:0;resize:none;border-radius:4px;overflow:hidden}
.lit{border-radius:2px;outline:none;cursor:text;transition:background .12s}
.lit:hover{background:var(--side)}
.lit:focus{background:var(--custom-tint);box-shadow:0 0 0 1px var(--custom)}
.lit:empty{display:inline-block;min-width:.6em}
.lit.chg{text-decoration:underline;text-decoration-color:var(--custom);text-decoration-thickness:1.5px;text-underline-offset:5px}
.drop{border:0;background:none;color:var(--muted);font-family:var(--ui);font-size:14px;line-height:1;padding:1px 3px;margin-left:1px;vertical-align:1px;border-radius:4px;opacity:.45}
.grp:hover .drop,.fwrap:hover .drop,.drop:focus-visible{opacity:1}
.fwrap{white-space:nowrap}
.drop:hover{color:var(--warn);background:var(--warn-tint)}
.sent{border-radius:3px;transition:background .12s}
.sdel{display:inline-block;visibility:hidden;border:0;background:var(--warn-tint);color:var(--warn);font-family:var(--ui);font-size:12px;font-weight:700;line-height:1;width:18px;height:18px;padding:0;margin:0 2px 0 1px;border-radius:50%;vertical-align:2px}
.sent:hover>.sdel,.sent:focus-within>.sdel,.sdel:focus-visible{visibility:visible}
.sent:has(>.sdel:hover){background:var(--warn-tint);text-decoration:line-through;text-decoration-color:var(--warn)}
.sent:has(>.sdel:hover) .opt,.sent:has(>.sdel:hover) .lit{background:none}
@media (hover:none){.sdel{visibility:visible;opacity:.55;background:none}}
.lit-ro.chg{text-decoration:underline;text-decoration-color:var(--custom);text-underline-offset:5px}
.pedit{outline:none;border-radius:3px;caret-color:var(--custom);margin-left:-4px!important;padding:0 4px}
.pedit:hover{background:var(--side)}
.pedit:focus{background:var(--custom-tint);box-shadow:0 0 0 1px var(--custom)}
.pedit ::selection{background:var(--warn-tint);color:var(--warn)}
.tok{white-space:normal}
.selbar{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:41;display:none;gap:6px}
.selbar.show{display:flex}
.selbar button{border:0;font-weight:700;border-radius:20px;padding:9px 16px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.18);white-space:nowrap}
.sb-del{background:var(--warn);color:#fff}.sb-save{background:var(--custom);color:#fff}
.slash{position:fixed;z-index:45;display:none;width:330px;max-width:calc(100vw - 16px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:4px;max-height:300px;overflow:auto}
.slash.show{display:block}
.sl-item{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 9px}
.sl-item b{display:block;font-size:14px}.sl-item span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-item.on,.sl-item:hover{background:var(--custom-tint)}
.sl-empty{padding:10px;font-size:13.5px;color:var(--muted)}
.snips{max-width:880px;margin:0 auto;display:grid;gap:12px}
.snip-help{color:var(--muted);margin:0}
.snip{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;justify-items:start}
.snip-name{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 10px;font-weight:700}
.snip-text{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 10px;font-family:var(--note);font-size:16px;line-height:1.6;resize:none;overflow:hidden}
.ins{margin:10px 0 14px;border:1px solid var(--line);border-left:3px solid var(--scrub);border-radius:6px;padding:10px 14px 4px;background:var(--paper)}
.ins-head{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ins-title{font-size:13px;font-weight:700;color:var(--scrub);margin-right:auto}
.ins .sheet,.ins .sec{margin-bottom:12px}
.sec-add{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:-2px 0 4px}
.sec-add .addtxt{margin:0}
.insadd{border:0;background:none;color:var(--scrub);font-size:13.5px;padding:2px 0;cursor:pointer;max-width:100%}
.insadd:hover{text-decoration:underline}
.grp[data-gk]{border-radius:4px;outline:none}
.grp[data-gk]:focus{outline:2px solid var(--scrub);outline-offset:3px;background:var(--scrub-tint)}
.grp[data-gk]:focus .opt[data-n]::after{content:attr(data-n);display:inline-block;font-family:var(--ui);font-size:10.5px;font-weight:700;line-height:15px;min-width:15px;text-align:center;margin-left:3px;border-radius:4px;background:var(--scrub);color:var(--paper);vertical-align:2px;text-decoration:none}
.fld:focus{outline:2px solid var(--scrub);outline-offset:2px}
.keys{margin-top:10px;line-height:1.5}
.create+.create{margin-top:8px}
aside{overflow:hidden}
#plist{flex:1 1 auto;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px 8px}
.ptabs{display:flex;gap:0;margin:10px 0 4px;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.ptabs button{flex:1;border:0;background:var(--paper);padding:7px 0;font-size:14px;border-right:1px solid var(--line)}
.ptabs button:last-child{border-right:0}
.ptabs button[aria-pressed="true"]{background:var(--scrub-tint);color:var(--scrub);font-weight:700}
.tab-help{font-size:12.5px;color:var(--muted);margin:10px 8px 0}
.linkish{border:0;background:none;color:var(--scrub);text-decoration:underline;padding:0;font-size:inherit}
.cmb.txt{color:var(--custom)}
.ttl-t{border:1px solid var(--line);background:var(--paper);border-radius:12px;font-size:11.5px;padding:1px 8px;color:var(--muted)}
.ttl-t[aria-pressed="true"]{border-color:var(--scrub);color:var(--scrub)}
.ins.notitle .ins-title{opacity:.6;font-weight:400}
.ttl-in{font:inherit;font-size:13.5px;font-weight:700;color:var(--scrub);border:0;border-bottom:1.5px dashed var(--scrub);background:transparent;padding:1px 2px;max-width:60%}
.ttl-in:focus{outline:none;border-bottom-style:solid;background:var(--scrub-tint)}
.ins-src{font-size:12px;color:var(--muted);margin-right:auto}
.ins-head .ttl-in+.ttl-t,.ins-head .ttl-in~.ttl-t{margin-left:auto}
.mp.mh{font-weight:700;margin-bottom:4px}
.optt{color:var(--scrub);font-weight:600}
.optfld{margin:0 1px}
.sheet.mini .opt.ex::before{content:"⓪ ";color:var(--scrub);font-weight:700}
.prev-chip{font-family:var(--ui);font-size:12.5px;background:var(--scrub-tint);color:var(--scrub);border-radius:6px;padding:5px 9px;margin:0 0 10px}
.ed-meta label.chk{flex-direction:row;align-items:center;gap:8px;flex:1 1 240px;font-weight:700}
.ed-meta label.chk .muted{font-weight:400;font-size:12px;margin-left:4px}
.par.hd p{font-family:var(--ui);font-size:15px!important;font-weight:700;color:var(--ink);margin:6px 0 4px!important;letter-spacing:.01em}
.par.hd p strong{font-weight:700}
.side-tools{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.tool{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 9px;font-size:13.5px;text-align:left;min-width:0}
.tool:hover{border-color:var(--muted)}
.tool .ti{width:18px;text-align:center;color:var(--scrub);font-weight:700;flex-shrink:0}
.tool[data-act="snips"]{border-color:var(--custom);color:var(--custom);font-weight:700}
.tool[data-act="snips"] .ti{color:var(--custom)}
.tool-wide{grid-column:1 / -1}
.tool kbd{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.side-tools .side-foot{grid-column:1 / -1;margin:2px 2px 0;padding:0;font-size:12px}
@media (hover:none){.tool kbd{display:none}.tool{padding:11px 10px}}
.newfree{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;border:0;border-radius:9px;background:var(--scrub);color:var(--paper);font-weight:700;font-size:15px;padding:10px 12px;text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.newfree:hover{filter:brightness(1.06)}
.newfree .nf-i{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.2);font-size:17px;line-height:1}
.newfree kbd{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:400;opacity:.8;border:1px solid rgba(255,255,255,.45);border-radius:4px;padding:0 5px}
@media (hover:none){.newfree kbd{display:none}}
.cmb{color:var(--scrub);margin-right:5px;font-weight:700}
.ce-list{display:grid;gap:12px}
.ce-sec{display:grid;gap:6px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.ce-sec:last-child{border-bottom:0;padding-bottom:0}
.ce-sh{font-weight:700;font-size:13.5px;color:var(--muted)}
.ce-bk{display:flex;align-items:center;gap:6px;background:var(--scrub-tint);border-radius:6px;padding:4px 6px 4px 10px}
.ce-n{flex:1;min-width:0;color:var(--scrub);font-weight:700;font-size:14px}
.btn.ic.sm{padding:3px 8px;font-size:13px}
.inspt{position:relative;height:16px;margin:-4px 0;display:flex;align-items:center;justify-content:center}
.inspt::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--scrub);opacity:0;transition:opacity .12s}
.inspt button{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:1px solid var(--scrub);background:var(--paper);color:var(--scrub);font-weight:700;line-height:1;padding:0;opacity:0;transition:opacity .12s}
.inspt:hover::before,.inspt:focus-within::before{opacity:.6}
.inspt:hover button,.inspt button:focus-visible{opacity:1}
@media (hover:none){.inspt button{opacity:.55;width:30px;height:30px}.inspt{height:26px}}
.item.txt{display:flex;gap:6px;align-items:flex-start}
.item.txt .xtra{flex:1}
.it-tools{display:flex;gap:2px;opacity:.35;padding-top:4px}
.item.txt:hover .it-tools,.item.txt:focus-within .it-tools{opacity:1}
@media (hover:none){.it-tools{opacity:.7}}
.ins-head .btn.ic.sm{padding:3px 7px}
.addblk{color:var(--scrub)!important}
.modal.pal{align-items:flex-start;padding-top:12vh}
.pal-box{background:var(--paper);border-radius:10px;width:100%;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:12px;display:grid;gap:8px}
#pallist{max-height:52vh;overflow:auto;display:grid}
.pal-g{font-size:12px;font-weight:700;color:var(--muted);padding:8px 8px 2px}
.pal-it{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;font-size:14.5px}
.pal-it span{margin-left:auto;font-size:12px;color:var(--muted)}
.pal-it.on,.pal-it:hover{background:var(--scrub-tint);color:var(--scrub)}
.pal-h{margin:0;font-size:12px}
.sl-g{font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 9px 2px}
.sl-item.blk b{color:var(--scrub)}
.slash{width:380px;max-height:none;overflow:visible;padding:0}
.sl-tabs{display:flex;align-items:center;gap:4px;padding:6px 6px 4px;border-bottom:1px solid var(--line)}
.sl-tab{border:1px solid var(--line);background:none;border-radius:14px;padding:2px 10px;font-size:12.5px}
.sl-tab span{color:var(--muted);font-size:11.5px}
.sl-tab.on{background:var(--custom-tint);border-color:var(--custom);color:var(--custom);font-weight:700}
.sl-k{margin-left:auto;font-size:11px;color:var(--muted)}
.sl-list{max-height:300px;overflow:auto;padding:2px 4px 4px}
.sl-foot{display:flex;align-items:center;border-top:1px solid var(--line);padding:4px 9px;font-size:11px;color:var(--muted)}
.sl-man{margin-left:auto;border:0;background:none;color:var(--custom);font-size:11.5px;font-weight:700;padding:2px 0;text-decoration:underline}
/* v17 barra */
.bar-gap{flex:1 1 0;min-width:0}
.prog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 12px 5px 8px;font-size:13.5px}
.prog-bar{display:inline-block;width:72px;height:6px;border-radius:4px;background:var(--amber-tint);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .25s}
.prog.done .prog-bar i{background:var(--scrub)}
.prog .pending{padding:0}
.prog.done .pending{color:var(--scrub)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-m="pick"]{background:var(--scrub-tint);color:var(--scrub);font-weight:700}
.seg button[aria-pressed="true"][data-m="write"]{background:var(--custom-tint);color:var(--custom);font-weight:700}
.seg button[aria-pressed="true"][data-m="erase"]{background:var(--warn-tint);color:var(--warn);font-weight:700}
.btn.ic{padding:7px 10px;font-size:15px;line-height:1}
.btn:disabled{opacity:.4;cursor:default}
.menu-w{position:relative;display:inline-block}
.menu{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:30;min-width:220px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:4px}
.menu.right{left:auto;right:0}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;font-size:14px}
.menu button:hover{background:var(--side)}
.menu .ck{width:14px;color:transparent;font-weight:700}
.menu [aria-checked="true"] .ck{color:var(--scrub)}

.hint .x{float:right;border:0;background:none;color:var(--muted);font-size:16px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;display:none;align-items:center;gap:12px;z-index:40;max-width:calc(100% - 32px)}
.toast.show{display:flex}
.toast.amber{background:var(--amber);color:#fff}
.toast button{border:1px solid rgba(255,255,255,.6);background:none;color:inherit;border-radius:6px;padding:4px 10px;font-size:13px}

@media (max-width:980px){.ed-grid{grid-template-columns:1fr}#src{min-height:320px}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  body.pick aside{display:flex;position:fixed;inset:0;height:100%;z-index:30;border:0;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
  body.pick{overflow:hidden}
  .close-pick{display:inline-block}
  .tpl{padding:11px 4px 11px 8px;font-size:16px}
  .btn.mob{display:inline-block;font-weight:700}
  .bar h1{flex-basis:100%;order:-1;font-size:17px}
  main{padding:0 12px 40px}
  .sheet{padding:22px 18px 26px}
  .par{padding-right:28px}
  .par-tools{right:-10px}
  .par-x{opacity:.55}
  .par p,.preview,.xtra{font-size:16px}
}

const LS="notarium:v2:";
function lsGet(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
const blankSettings=()=>({fav:[],recent:[],sticky:{},vis:{}});
const Store={settings:Object.assign(blankSettings(),lsGet("settings",{})),custom:(lsGet("custom",{items:{}}).items)||{},cloud:false,refs:null};
function migrateVis24(){if(Store.settings.visMig24)return false;const ids=["x_cerv","x_tor","x_lumb","x_si","x_cad","x_rod","x_pie","x_hom","x_cran","x_mano","x_abd","x_neuro","x_crps","x_mio","r_ef","r_ana","r_plan","c_id","c_anam","c_ttos","c_ant","c_ros","c_flags","c_psico","c_parac","c_dx","c_anal","c_plan"];
  const V=Store.settings.vis||{};ids.forEach(id=>{const v=V[id];if(!v||!v.par||(Store.custom[id]&&Store.custom[id].override))return;const np={};for(const[k,val] of Object.entries(v.par)){const[s,i]=k.split(":");np[s==="s0"?"s0:"+(+i+1):k]=val}v.par=np});
  Store.settings.visMig24=true;return true}
setTimeout(()=>{const a=migrateSnips(),b=migrateVis24();if(a)saveCustom();if(a||b){saveSettings();parsedCache.clear();render()}},0);
TEMPLATES.forEach(t=>{try{const o=localStorage.getItem("notarium:sticky:"+t.id);if(o&&!Store.settings.sticky[t.id])Store.settings.sticky[t.id]=JSON.parse(o)}catch(e){}});

function makeSaver(name,body){
  let timer=null,busy=false,again=false;
  async function flush(){
    if(!Store.cloud)return;
    if(busy){again=true;return}
    busy=true;
    try{await Store.refs[name].set(JSON.parse(JSON.stringify(body())))}
    catch(e){if(e&&e.code==="unavailable"){busy=false;setTimeout(flush,700+Math.random()*900);return}setSync("error")}
    busy=false;
    if(again){again=false;flush()}
  }
  return()=>{lsSet(name,body());clearTimeout(timer);timer=setTimeout(flush,700)};
}
const saveSettings=makeSaver("settings",()=>Store.settings);
const saveCustom=makeSaver("custom",()=>({items:Store.custom}));

function setSync(mode){
  const el=document.getElementById("sync");
  el.textContent=mode==="cloud"?"Guardado en tu cuenta: tus plantillas y preferencias te siguen en cualquier dispositivo."
    :mode==="error"?"No se pudo guardar en tu cuenta; los cambios quedan en este navegador."
    :"Guardado en este navegador.";
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const base="data/users/"+uid+"/";
    Store.refs={settings:db.doc(base+"settings"),custom:db.doc(base+"custom")};
    const [s,c]=await Promise.all([Store.refs.settings.get(),Store.refs.custom.get()]);
    Store.cloud=true;
    if(s.exists)Store.settings=Object.assign(blankSettings(),JSON.parse(JSON.stringify(s.data())));else saveSettings();
    if(c.exists)Store.custom=JSON.parse(JSON.stringify((c.data()||{}).items||{}));else if(Object.keys(Store.custom).length)saveCustom();
    lsSet("settings",Store.settings);lsSet("custom",{items:Store.custom});
    {const a=migrateSnips(),b=migrateVis24();if(a)saveCustom();if(a||b)saveSettings()}
    parsedCache.clear();setSync("cloud");render();
  }catch(e){setSync("local")}
}

const NAME_RE=/^([\p{L}\p{N}_ °-]{1,30}):\s/u;
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||"campo"}
function parseSource(c){
  const vars={},sticky=[],sections=[],names={};let sec=null,auto=0,buf=[];
  const keyFor=name=>{let k=slug(name),b=k,i=2;while(vars[k])k=b+"_"+(i++);names[name]=k;return k};
  const RE=/\[([^\[\]]+)\]|\{([^{}]+)\}/g;
  function convertLine(line){
    let out="",last=0;
    for(const m of line.matchAll(RE)){
      out+=line.slice(last,m.index);last=m.index+m[0].length;
      const before=out.replace(/\*\*/g,"").trimEnd();
      const capIt=before===""||/[.!?]$/.test(before);
      const tok=k=>"{{"+k+(capIt?"|cap":"")+"}}";
      if(m[1]!=null){
        let body=m[1].trim(),multi=false,st=false;
        let list=false;if(/^-\s/.test(body)){multi=true;list=true;body=body.slice(1).trimStart()}
        while(/^[*@]/.test(body)){if(body[0]==="*")multi=true;else st=true;body=body.slice(1).trimStart()}
        if(body.startsWith("%")){const nmm=body.slice(1).trim()||"anestésicos";const key=keyFor(nmm);vars[key]={label:nmm,kind:"la"};out+=tok(key);continue}
        if(body.startsWith("?")){const qid=body.slice(1).trim().toLowerCase();const key=keyFor("q_"+qid);let ql=qid;try{ql=(QUESTS[qid]||{}).name||qid}catch(_){}vars[key]={label:ql,kind:"quest",qid};out+=tok(key);continue}
        if(body.startsWith("#")){const nmm=body.slice(1).trim()||"opioides";if(names[nmm]&&vars[names[nmm]]){out+=tok(names[nmm]);continue}const key=keyFor(nmm);vars[key]={label:nmm,kind:"opioid"};out+=tok(key);continue}
        let name=null;const nm=body.match(NAME_RE);
        if(nm){name=nm[1].trim();body=body.slice(nm[0].length)}

**Puntos gatillo:** [*puntos gatillo: no se encuentran puntos gatillo / puntos gatillo en trapecio superior / puntos gatillo en elevador de la escápula / puntos gatillo en romboides / puntos gatillo en infraespinoso / puntos gatillo en cuadrado lumbar / puntos gatillo en glúteo medio / puntos gatillo en piriforme / puntos gatillo en paravertebrales], banda tensa palpable [banda tensa: ausente / presente], respuesta de espasmo local [espasmo local: ausente / presente], [referido: no reproduce dolor referido / reproduce el dolor referido característico del paciente], signo del salto [salto: ausente / presente].

## Fibromialgia (oculta)
**Fibromialgia:** índice de dolor generalizado (WPI) {WPI}/19, escala de gravedad de síntomas (SSS) {SSS}/12. [fibromialgia: No cumple criterios ACR 2016 de fibromialgia / Cumple criterios ACR 2016 de fibromialgia].

## Hipermovilidad (oculta)
**Hipermovilidad:** Beighton {Beighton}/9.
`},
{id:"x_rizdq",name:"Mano: rizartrosis y De Quervain",short:"RIZDQ",source:`## Síntomas
**Mano y muñeca** [lado: derecha / izquierda]

**Síntomas:** Dolor en [localización mano: la base del pulgar / el borde radial de la muñeca / la base del pulgar y el borde radial de la muñeca], [dominancia: en la mano dominante / en la mano no dominante]. Tiempo de evolución: {tiempo de evolución}. Desencadenantes: [*agravantes mano: 0 sin desencadenantes claros / la pinza / girar llaves o perillas / abrir frascos / escribir / cargar a un bebé / uso del celular / desviación cubital de la muñeca]. [*síntomas asociados mano: 0 sin otros síntomas / rigidez matutina / sensación de debilidad o caída de objetos / chasquido o bloqueo del pulgar / parestesias en la mano].

## Inspección y palpación
**Inspección:** [*inspección mano: 0 sin deformidades ni tumefacción / tumefacción en la base del pulgar / tumefacción sobre la estiloides radial / subluxación de la base del primer metacarpiano (signo del hombro) / deformidad en Z del pulgar con hiperextensión metacarpofalángica / atrofia tenar].

**Palpación:** [*palpación mano: 0 sin dolor a la palpación / dolor en la articulación trapeciometacarpiana / dolor en la articulación escafotrapeciotrapezoidea / dolor sobre el primer compartimento dorsal en la estiloides radial / engrosamiento del primer compartimento dorsal / dolor en la tabaquera anatómica / nódulo o dolor en la polea A1 del pulgar]. [*crepitación mano: 0 sin crepitación / crepitación trapeciometacarpiana / crepitación sobre los tendones del primer compartimento / crepitación 4 a 6 cm proximal a la estiloides radial (sugiere síndrome de intersección)].

## Movilidad y fuerza
**Movilidad del pulgar:** abducción radial [abducción radial: completa e indolora / dolorosa / limitada], abducción palmar [abducción palmar: completa e indolora / dolorosa / limitada], oposición [oposición: completa, Kapandji 10 / limitada, Kapandji {Kapandji}]. **Muñeca:** [movilidad muñeca: arcos completos e indoloros / dolor en desviación cubital / limitación de la flexoextensión].

**Fuerza:** [fuerza comparada: simétrica con el lado contralateral / disminuida respecto al lado contralateral / limitada por dolor]. Dinamometría: [dinamometría: no medida / prensión {prensión en kg} kg y pinza lateral {pinza en kg} kg].

## Pruebas de rizartrosis
**Pruebas de rizartrosis:** prueba de compresión y rotación axial (grind) [grind: negativa / positiva], prueba de palanca (lever) [lever: negativa / positiva], prueba de distracción [distracción pulgar: negativa / positiva, alivia el dolor], dolor en la pinza [pinza dolor: ausente / presente].

## Pruebas de De Quervain
**Pruebas de De Quervain:** Finkelstein [Finkelstein: negativo / positivo], Eichhoff [Eichhoff: negativo / positivo], prueba de hiperflexión y abducción del pulgar (WHAT) [WHAT: negativa / positiva], extensión resistida del pulgar [extensión resistida: indolora / dolorosa en el primer compartimento].

## Diagnóstico diferencial
**Diferencial:** Tinel de la rama superficial del nervio radial [Wartenberg: negativo / positivo, sugiere neuritis de Wartenberg], Phalen [Phalen dq: negativo / positivo], Tinel en el túnel del carpo [Tinel carpo dq: negativo / positivo], dedo en gatillo del pulgar [gatillo: ausente / presente].

**Neurovascular:** [neurovascular mano: Sensibilidad conservada en los territorios del mediano, cubital y radial superficial, llenado capilar menor de 2 segundos / Hipoestesia en el territorio del radial superficial / Hipoestesia en el territorio del mediano].

## Imágenes (oculta)
**Imágenes:** Radiografía de mano [Eaton-Littler: no disponible / con rizartrosis estadio I de Eaton-Littler / con rizartrosis estadio II de Eaton-Littler / con rizartrosis estadio III de Eaton-Littler / con rizartrosis estadio IV de Eaton-Littler, compromiso escafotrapeciotrapezoideo]. Ecografía [eco mano: no realizada / con engrosamiento y tenosinovitis del primer compartimento dorsal / con septo intracompartimental en el primer compartimento / con sinovitis trapeciometacarpiana].

## Impresión diagnóstica
**Impresión diagnóstica, mano {lado}:** [*impresión mano: 0 examen sin hallazgos patológicos / rizartrosis (artrosis trapeciometacarpiana) / tenosinovitis de De Quervain / síndrome de intersección / neuritis de Wartenberg / artrosis escafotrapeciotrapezoidea / dedo en gatillo del pulgar / síndrome del túnel del carpo].

## Plan (oculta)
**Plan:** [- plan mano: ortesis de reposo para el pulgar / modificación de actividades y protección articular / terapia de mano / analgésico tópico / infiltración ecoguiada de la articulación trapeciometacarpiana / infiltración ecoguiada del primer compartimento dorsal / radiofrecuencia o bloqueo de nervios sensitivos del pulgar / valoración por cirugía de mano].
`}

const BREG={id:"breg",name:"Bloqueo regional",short:"BREG",source:`## Encabezado
**Nota de anestesia regional** para {procedimiento quirúrgico}, cirujano {cirujano}.

**Evaluación:** Paciente de {peso} kg, ASA [ASA: I / II / III / IV / II E / III E], [anticoagulación: sin anticoagulantes ni antiplaquetarios / con anticoagulación o antiplaquetarios manejados según guías ASRA], [coagulación: sin coagulopatía conocida / con paraclínicos de coagulación dentro de límites aceptables], [examen neurológico previo: sin déficit neurológico previo en la extremidad a bloquear / con déficit neurológico previo documentado].

## Bloqueo
**Bloqueo realizado:** [bloqueo: bloqueo interescalénico del plexo braquial / bloqueo supraclavicular del plexo braquial / bloqueo infraclavicular del plexo braquial / bloqueo axilar del plexo braquial / bloqueo del nervio supraescapular / bloqueo de nervios terminales del miembro superior / bloqueo del plexo cervical superficial / bloqueo PENG / bloqueo de la fascia ilíaca suprainguinal / bloqueo del nervio femoral / bloqueo del canal de los aductores / bloqueo iPACK / bloqueo del nervio ciático en la fosa poplítea / bloqueo del nervio safeno / bloqueo de tobillo / bloqueo del plano del erector de la columna (ESP) / bloqueo paravertebral torácico / bloqueo PECS I y II / bloqueo del plano del serrato anterior / bloqueo del plano transverso del abdomen (TAP) / bloqueo del cuadrado lumbar / bloqueo de la vaina de los rectos / bloqueo ilioinguinal e iliohipogástrico / bloqueo del nervio pudendo] [lado: derecho / izquierdo / bilateral].

**Indicación:** [indicación: anestesia quirúrgica / analgesia postoperatoria / anestesia quirúrgica y analgesia postoperatoria / analgesia de rescate en recuperación], como [técnica principal: técnica anestésica única / complemento de anestesia general / complemento de anestesia neuroaxial / técnica principal con sedación].

## Consentimiento y seguridad
**Consentimiento y seguridad:** Se explican riesgos, beneficios y alternativas, incluyendo bloqueo fallido o incompleto, punción vascular, hematoma, infección, lesión nerviosa transitoria o permanente, toxicidad sistémica por anestésicos locales y [riesgos específicos: riesgos específicos según el abordaje / bloqueo del nervio frénico con disnea / neumotórax / bloqueo motor prolongado con riesgo de caídas]. Se obtiene consentimiento informado escrito. Se realiza pausa de seguridad con verificación y marcación de lateralidad inmediatamente antes de la punción ("stop before you block"). Emulsión lipídica al 20% y equipo de reanimación disponibles.

## Preparación
**Preparación:** Monitoría estándar ASA, oxígeno suplementario por [oxígeno: cánula nasal / máscara facial], acceso venoso periférico permeable, paciente [sedación: sin sedación, colaborador / bajo sedación ligera con midazolam y fentanilo, colaborador / bajo anestesia general]. Posición: [posición: decúbito supino / decúbito lateral / decúbito prono / sentado / semisentado].

## Técnica
**Técnica:** Asepsia y antisepsia con clorhexidina, campos estériles y funda estéril para el transductor. Bajo [guía: guía ecográfica / guía ecográfica y neuroestimulación] con transductor [transductor: lineal de alta frecuencia / convexo de baja frecuencia], previa infiltración de la piel con lidocaína al 1%, se avanza aguja [aguja: ecogénica de bisel corto 22 G de 50 mm / ecogénica de bisel corto 22 G de 80 mm / ecogénica de bisel corto 21 G de 100 mm / Tuohy 18 G para catéter] con abordaje [abordaje: en plano / fuera de plano], visualizando la punta en todo momento.

[neuroestimulación: Sin neuroestimulación / Respuesta motora adecuada que desaparece por debajo de 0,5 mA, sin respuesta por debajo de 0,2 mA].

Se confirma posición con hidrodisección con solución salina. Con aspiración negativa, [presión: presión de inyección menor de 15 psi / sin resistencia a la inyección], inyección fraccionada cada 3 a 5 mL y sin parestesias ni dolor a la inyección, se administra {anestésico local, concentración y volumen}. Adyuvantes: [*adyuvantes regionales: sin adyuvantes / dexametasona 4 mg perineural / dexametasona 4 a 8 mg IV / dexmedetomidina 50 mcg perineural / epinefrina 5 mcg/mL]. Se observa [dispersión: adecuada dispersión perineural alrededor de las estructuras objetivo / adecuada dispersión en el plano fascial objetivo / dispersión parcial; se redirige la aguja con adecuada dispersión final].

## Catéter perineural (oculta)
**Catéter:** Se avanza catéter perineural, dejándolo a {cm en piel} cm en piel, con confirmación ecográfica de la dispersión por el catéter. Se fija con apósito transparente. Infusión: {esquema de infusión}.

## Evaluación del bloqueo
**Evaluación:** A los {minutos} minutos, [resultado: bloqueo sensitivo y motor completo en el territorio esperado / bloqueo sensitivo completo con bloqueo motor parcial / bloqueo incompleto; se complementa con infiltración local por el cirujano / bloqueo incompleto; se complementa con bloqueo de rescate / bloqueo fallido; se convierte a anestesia general].

## Complicaciones
**Complicaciones:** [complicaciones: Sin complicaciones / Punción vascular sin consecuencias, con compresión local / Parestesia transitoria durante la punción; se retira y redirige la aguja / Signos de toxicidad sistémica por anestésicos locales, manejados según protocolo con emulsión lipídica / Disnea por bloqueo frénico, con saturación conservada y manejo de soporte].

## Indicaciones post-bloqueo
**Indicaciones:** Se educa al paciente y al personal de enfermería sobre la duración esperada del bloqueo de [duración: 6 a 12 horas / 12 a 24 horas / 24 a 36 horas], protección de la extremidad bloqueada y prevención de caídas, inicio de analgesia oral antes de que regrese la sensibilidad para evitar dolor de rebote, y signos de alarma: debilidad o adormecimiento que persista más allá de lo esperado, dolor intenso, disnea, sabor metálico, tinnitus o mareo.

{@anestesiólogo=Dr. Mateo Uribe Moreno}, Médico anestesiólogo. {fecha=hoy}.
`};

  const m=$("bkmsg");if(!obj||obj.app!=="notarium"||!obj.settings||!obj.custom){m.innerHTML=`<p class="err">Ese archivo no es un respaldo de Notarium.</p>`;BK=null;return}
  BK=obj;const c=Object.values(obj.custom),s=(obj.settings.snips||[]).length;
  m.innerHTML=`<p>Respaldo de <b>${esc(obj.version||"")}</b> del ${esc((obj.exported||"").slice(0,10))}: ${c.filter(x=>!x.override).length} plantillas propias, ${c.filter(x=>x.override).length} versiones de plantillas incluidas y ${s} frases.</p>
  <div class="row"><button class="btn primary" data-bk="merge">Combinar con lo que tengo</button><button class="btn danger" data-bk="replace">${S.bkArm?"Confirmar: reemplazar todo":"Reemplazar todo"}</button><button class="btn" data-bk="cancel">Cancelar</button></div>
  <p class="muted">Combinar agrega lo que falta y actualiza lo que sea más reciente en el respaldo. Reemplazar deja exactamente lo del respaldo.</p>`;
}
function bkApply(mode){
  const o=BK;if(!o)return;
  if(mode==="replace"){Store.settings=Object.assign(blankSettings(),o.settings);Store.custom=o.custom}
  else{
    for(const[id,c] of Object.entries(o.custom)){const cur=Store.custom[id];if(!cur||(c.updated||0)>(cur.updated||0))Store.custom[id]=c}
    const s=Store.settings,b=o.settings;
    s.fav=[...new Set([...(s.fav||[]),...(b.fav||[])])];
    const have=new Set(snips().map(x=>x.id));(b.snips||[]).forEach(x=>{if(!have.has(x.id))snips().push(x)});
    ["sticky","vis"].forEach(k=>{s[k]=s[k]||{};for(const[id,v] of Object.entries(b[k]||{}))if(!(id in s[k]))s[k][id]=v});
  }
  migrateSnips();parsedCache.clear();S.notes={};saveSettings();saveCustom();BK=null;S.bkArm=false;renderPicker();renderAbout();toast(mode==="replace"?"Respaldo restaurado":"Respaldo combinado");
}
document.addEventListener("change",e=>{if(e.target.id!=="bkfile")return;const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S.bkArm=false;bkPreview(JSON.parse(r.result))}catch(_){bkPreview(null)}};r.readAsText(f);e.target.value=""});
document.addEventListener("click",e=>{const b=e.target.closest("[data-bk]");if(!b)return;const a=b.dataset.bk;
  if(a==="export")bkExport();else if(a==="merge")bkApply("merge");else if(a==="cancel"){BK=null;S.bkArm=false;$("bkmsg").innerHTML=""}
  else if(a==="replace"){if(!S.bkArm){S.bkArm=true;bkPreview(BK);return}bkApply("replace")}});

const snips=()=>Store.settings.snips||(Store.settings.snips=[]);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const catOf=x=>(x.cat||"").trim()||"Sin categoría";
function snipCats(){return[...new Set(snips().map(catOf))].sort((a,b)=>a==="Sin categoría"?1:b==="Sin categoría"?-1:a.localeCompare(b,"es"))}
function renderSnips(){

  const cats=snipCats(),f=S.snipCat||"";
  $("view").innerHTML=`<div class="snips"><p class="snip-help">Escribe <b>/</b> en el texto de una nota y unas letras del nombre o la categoría para insertar una frase. También puedes seleccionar texto en una nota y tocar <b>Guardar como frase</b>.</p>

function renderSnipList(){

  ${g[c].sort((a,b)=>(a.name||"").localeCompare(b.name||"","es")).map(x=>`<div class="snip"><div class="snip-row"><input class="snip-name" data-snip="${x.id}" data-f="name" value="${esc(x.name)}" placeholder="Nombre corto, ej. egreso dolor" aria-label="Nombre de la frase"><input class="snip-cat-in" data-snip="${x.id}" data-f="cat" value="${esc(x.cat||"")}" list="snipcats" placeholder="Categoría" aria-label="Categoría"></div><textarea class="snip-text" data-snip="${x.id}" data-f="text" rows="2" placeholder="Texto de la frase" aria-label="Texto de la frase">${esc(x.text)}</textarea><button class="btn danger sm" data-snip-act="del" data-id="${x.id}">${S.snipDel===x.id?"Confirmar: borrar":"Borrar"}</button></div>`).join("")}</section>`).join("");
  box.querySelectorAll(".snip-text").forEach(grow);

function snipAction(b){const a=b.dataset.snipAct;
  if(a==="cat"){S.snipCat=b.dataset.cat;renderSnips();return}
  if(a==="add"){const cat=b.dataset.cat!=null?b.dataset.cat:(S.snipCat&&S.snipCat!=="Sin categoría"?S.snipCat:"");const id="s"+Date.now().toString(36);snips().unshift({id,name:"",text:"",cat});S.snipQ="";saveSettings();renderSnips();const f=document.querySelector(`.snip-name[data-snip="${id}"]`);if(f){f.focus();f.scrollIntoView({block:"center"})}return}

}
function snipInput(el){if(el.id==="snipq"){S.snipQ=el.value;renderSnipList();return}const x=snips().find(s=>s.id===el.dataset.snip);if(!x)return;x[el.dataset.f]=el.value;if(el.tagName==="TEXTAREA")grow(el);saveSettings()}
const SL={open:false,items:[],idx:0};
function closeSlash(){SL.open=false;if(!SL.keepFilter)SL.filter="all";const p=$("slash");if(p)p.className="slash"}
function slashCheck(el){
  let before="",rect;
  if(el.tagName==="TEXTAREA"){before=el.value.slice(0,el.selectionStart);const r=el.getBoundingClientRect();rect={left:r.left+10,bottom:r.bottom}}
  else{const s=window.getSelection();if(!s.rangeCount||!s.isCollapsed)return closeSlash();const r=s.getRangeAt(0),node=r.startContainer;if(node.nodeType!==3)return closeSlash();before=node.data.slice(0,r.startOffset);const rr=r.getBoundingClientRect();rect={left:rr.left,bottom:rr.bottom||(rr.top+20)};SL.node=node;SL.off=r.startOffset}
  const m=before.match(/(?:^|\s)\/([\p{L}\p{N} ]{0,30})$/u);if(!m)return closeSlash();
  SL.el=el;SL.len=m[1].length+1;const q=norm(m[1].trim());
  const all=snips().filter(x=>x.text.trim());
  const uB=Store.settings.useBlk||{},hostT=slashHost(el);
  const rank=x=>(q&&norm(x.name).startsWith(q)?0:1)*1e6-(uB[x.id]||0);
  const bl=allTpls().filter(x=>isBlock(x)&&(!hostT||x.id!==hostT.host.id)&&(x.textOnly||hostT)&&(!q||norm(x.name+" "+x.short+" "+x.group+" "+(x.textOnly?textOf(x):"")).includes(q))).sort((a,b)=>rank(a)-rank(b)).slice(0,14);
  if(!bl.length&&q)return closeSlash();
  SL.items=bl.map(x=>({type:x.textOnly?"txt":"blk",id:x.id,name:x.name,group:x.group,text:x.textOnly?textOf(x):""}));SL.idx=0;
  const p=$("slash");
  let h=`<div class="sl-list">`+(bl.length?SL.items.map((x,i)=>`<button class="sl-item${x.type==="blk"?" blk":""}${i===0?" on":""}" data-sl="${i}"><b>${x.type==="blk"?"⧉":"¶"} ${esc(x.name)}<em>${esc(x.group)}</em></b>${x.type==="txt"?`<span>${esc(x.text.slice(0,90))}</span>`:`<span>${hostT?"Se inserta como parte de la nota":""}</span>`}</button>`).join(""):`<div class="sl-empty">Aún no tienes bloques que coincidan.</div>`);
  h+=`</div><div class="sl-foot">¶ texto se pega aquí, ⧉ con opciones se inserta debajo<button class="sl-man" data-act="blocks">Ver bloques</button></div>`;
  p.innerHTML=h;
  p.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-340))+"px";p.style.top=Math.min(rect.bottom+6,window.innerHeight-60)+"px";
  p.className="slash show";SL.open=true;
}
function slashHost(el){
  const outer=el.closest(".ins.item");
  if(outer){const[hid,sid,i]=outer.dataset.item.split("|");return{host:tplById(hid),sid,idx:+i+1}}
  const it=el.closest(".item");
  if(it){const[hid,sid,i]=it.dataset.item.split("|");const h=tplById(hid);if(h&&!h.virtual)return{host:h,sid,idx:+i+1}}
  const pe=el.closest(".pedit");if(pe){const t=ctxTpl(pe);if(t&&!t.virtual)return{host:t,sid:pe.dataset.pk.split(":")[0],idx:0}}
  return null}
function slashPick(i){
  const x=SL.items[i];if(!x)return closeSlash();const el=SL.el;closeSlash();bumpUse(x.id);
  if(x.type==="blk"){const tg=slashHost(el);
    if(el.tagName==="TEXTAREA"){const st=el.selectionStart;el.setRangeText("",st-SL.len,st,"end");el.dispatchEvent(new Event("input",{bubbles:true}))}
    else{const s=window.getSelection(),r=document.createRange();try{r.setStart(SL.node,SL.off-SL.len);r.setEnd(SL.node,SL.off);s.removeAllRanges();s.addRange(r);document.execCommand("delete")}catch(_){}}
    if(tg)addBlock(tg.host,tg.sid,tg.idx,x.id);return}
  if(el.tagName==="TEXTAREA"){const st=el.selectionStart;el.setRangeText(x.text,st-SL.len,st,"end");el.dispatchEvent(new Event("input",{bubbles:true}));el.focus();return}
  const s=window.getSelection(),r=document.createRange();try{r.setStart(SL.node,SL.off-SL.len);r.setEnd(SL.node,SL.off)}catch(_){return}
  s.removeAllRanges();s.addRange(r);document.execCommand("insertText",false,x.text);
}
document.addEventListener("mousedown",e=>{if(e.target.closest("#slash"))e.preventDefault()});
document.addEventListener("click",e=>{const f=e.target.closest("[data-slf]");if(f){e.stopImmediatePropagation();SL.filter=f.dataset.slf;if(SL.el){SL.keepFilter=true;SL.el.focus();slashCheck(SL.el);SL.keepFilter=false}return}const b=e.target.closest("[data-sl]");if(b)slashPick(+b.dataset.sl);else if(SL.open&&!e.target.closest("#slash"))closeSlash()},true);
document.addEventListener("keydown",e=>{
  if(!SL.open)return;
  const items=document.querySelectorAll("#slash .sl-item");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();e.stopImmediatePropagation();if(!items.length)return;SL.idx=(SL.idx+(e.key==="ArrowDown"?1:items.length-1))%items.length;items.forEach((b,i)=>b.classList.toggle("on",i===SL.idx));return}
  if(e.key==="Enter"||e.key==="Tab"){if(!items.length){closeSlash();return}e.preventDefault();e.stopImmediatePropagation();slashPick(SL.idx);return}
  if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();closeSlash()}
},true);

/* ---------- teclado ---------- */
const stops=()=>[...document.querySelectorAll("#sheet .grp[data-gk], #sheet .fld")];
const isPend=el=>el.classList.contains("grp")?!el.classList.contains("chosen"):!el.value.trim();
const stopId=el=>ctxTpl(el).id+"|"+(el.dataset.gk||el.dataset.key);
const findStop=id=>stops().find(x=>stopId(x)===id);
function goNext(from,dir){
  const L=stops();if(!L.length)return;
  let start=from?L.indexOf(from):-1;
  if(from&&start<0){const f=L.findIndex(s=>from.compareDocumentPosition(s)&Node.DOCUMENT_POSITION_FOLLOWING);start=f<0?L.length-1:f-(dir>0?1:0)}
  for(let i=1;i<=L.length;i++){const j=((start+dir*i)%L.length+L.length)%L.length;if(isPend(L[j])){L[j].focus({preventScroll:true});L[j].scrollIntoView({block:"center",behavior:"smooth"});return}}
  toast("No queda nada pendiente. Ctrl+Enter copia la nota.");
}
document.addEventListener("keydown",e=>{
  if(S.view!=="note"||SL.open)return;
  const tg=e.target;
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.code==="KeyM"){e.preventDefault();Store.settings.ptab="blk";saveSettings();document.body.classList.add("pick");renderPicker();$("q").focus();return}
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.code==="KeyN"){e.preventDefault();openTpl("libre");return}
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.code==="KeyB"){e.preventDefault();const b=document.querySelector('#bar [data-m="erase"]');if(b)b.click();return}
  if(e.key==="Escape"&&S.erase){S.erase=false;showHint();render();return}
  if(e.key==="Escape"&&S.openGrp){S.openGrp=null;document.querySelectorAll(".grp.cmp.open").forEach(x=>x.classList.remove("open"));return}
  const typingIn=tg.matches&&(tg.matches("input,textarea,select")||tg.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==="z"||e.key==="Z"||e.key==="y")&&!typingIn){e.preventDefault();if(e.key==="y"||e.shiftKey)redo();else undo();return}
  if(e.key==="?"&&!typingIn){e.preventDefault();showKeys(false);return}
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();const b=document.querySelector('#bar [data-act="copy"]');if(b)b.click();return}
  if(tg.closest&&(tg.closest("aside")||tg.closest(".opi")||tg.classList.contains("cust-in")))return;
  const g=tg.closest&&tg.closest(".grp[data-gk]");
  if(e.key==="Tab"&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&(tg===document.body||(tg.closest&&tg.closest("#sheet")))){e.preventDefault();goNext(g||tg,e.shiftKey?-1:1);return}
  if(g&&tg===g){
    if(/^[1-9]$/.test(e.key)){const o=g.querySelector(`.opt[data-n="${e.key}"]`);if(!o)return;e.preventDefault();const id=stopId(g),multi=g.classList.contains("multi");o.click();const el=findStop(id);if(el){if(multi)el.focus({preventScroll:true});else goNext(el,1)}return}
    if(e.key==="Enter"){e.preventDefault();goNext(g,1);return}
    if(e.key===" "&&g.classList.contains("cmp")){e.preventDefault();g.querySelector("[data-cpt]").click();return}
    if(e.key==="Backspace"||e.key==="Delete"){e.preventDefault();pushHist();const t=ctxTpl(g),k=g.dataset.gk,id=stopId(g);note(t).values[k]=t.vars[k].kind==="multi"?[]:null;render();const el=findStop(id);if(el)el.focus({preventScroll:true});return}
    if(e.key==="+"){e.preventDefault();const ad=g.querySelector("[data-add]");if(ad)ad.click();return}
  }
  if(tg.classList&&tg.classList.contains("fld")&&e.key==="Enter"){e.preventDefault();goNext(tg,1)}
});
/* ---------- borrador ---------- */
let ER=null;
function erUnit(x,y,p){const el=document.elementFromPoint(x,y);const u=el&&el.closest&&el.closest("[data-u]");return u&&u.closest("p")===p?u:null}
function erMark(){if(!ER)return;const lo=Math.min(ER.a,ER.b),hi=Math.max(ER.a,ER.b);ER.p.querySelectorAll("[data-u]").forEach(x=>{const u=+x.dataset.u;x.classList.toggle("kill",u>=lo&&u<=hi)})}
document.addEventListener("pointerdown",e=>{
  if(!S.erase||S.view!=="note")return;const u=e.target.closest&&e.target.closest("#sheet [data-u]");if(!u)return;
  const p=u.closest("p");if(!p||!p.dataset.pk)return;
  if(e.pointerType==="mouse"||e.pointerType==="pen")e.preventDefault();
  ER={p,pk:p.dataset.pk,t:ctxTpl(p),a:+u.dataset.u,b:+u.dataset.u,type:e.pointerType};erMark();
});
document.addEventListener("pointermove",e=>{if(!ER||ER.type==="touch")return;const u=erUnit(e.clientX,e.clientY,ER.p);if(u){ER.b=+u.dataset.u;erMark()}});
document.addEventListener("pointercancel",()=>{if(ER){ER.p.querySelectorAll(".kill").forEach(x=>x.classList.remove("kill"));ER=null}});
document.addEventListener("pointerup",()=>{
  if(!ER)return;const{t,pk,p}=ER,lo=Math.min(ER.a,ER.b),hi=Math.max(ER.a,ER.b);ER=null;
  const n=note(t),bl=blockOf(t,pk);if(bl==null)return;const pr=parts(bl);pushHist();
  lastCut={tid:t.id,pk,lit:n.lit[pk]?[...n.lit[pk]]:null,drop:n.drop[pk]?{...n.drop[pk]}:null};
  const Ls=[...(n.lit[pk]||pr.lits)],dr={...(n.drop[pk]||{})},cuts=[];
  p.querySelectorAll("[data-u]").forEach(x=>{const u=+x.dataset.u;if(u<lo||u>hi)return;if(x.dataset.tj!=null)dr[+x.dataset.tj]=true;else cuts.push({li:+x.dataset.li,a:+x.dataset.a,b:+x.dataset.b})});
  cuts.sort((x,y)=>y.a-x.a).forEach(c=>{Ls[c.li]=Ls[c.li].slice(0,c.a)+Ls[c.li].slice(c.b)});
  n.lit[pk]=Ls.map(x=>x.replace(/\*\*\s*\*\*/g,"").replace(/\*\*(\S[^*]*?)\s+\*\*/g,"**$1** "));n.drop[pk]=dr;
  render();
  toast("Borrado",false,{label:"Deshacer",solo:true,fn:()=>{$("toast").className="toast";undo()}});
});
let lastCut=null;
function closeMenus(){document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open"))}
document.addEventListener("click",e=>{const mb=e.target.closest("[data-menu]");if(mb){const m=document.querySelector(`[data-menu-for="${mb.dataset.menu}"]`),was=m&&m.classList.contains("open");closeMenus();if(m&&!was)m.classList.add("open");e.stopPropagation();return}if(!e.target.closest(".menu"))closeMenus()},true);
const KEYS_HTML=`<dl class="kl"><dt>Tab / Shift+Tab</dt><dd>Siguiente o anterior pendiente</dd><dt>1 a 9</dt><dd>Elige la opción del grupo resaltado</dd><dt>Espacio</dt><dd>Abre un grupo compacto</dd><dt>Retroceso</dt><dd>Borra la elección del grupo resaltado</dd><dt>+</dt><dd>Escribe otra opción solo para esta nota</dd><dt>Ctrl+Z / Ctrl+Shift+Z</dt><dd>Deshacer y rehacer cualquier cambio de la nota</dd><dt>Alt+B</dt><dd>Entra o sale del modo Borrar</dd><dt>/</dt><dd>Inserta un bloque mientras escribes, o abre la paleta si no estás escribiendo</dd><dt>Ctrl+Enter</dt><dd>Copia la nota</dd><dt>Ctrl+K</dt><dd>Busca otra nota</dd><dt>Alt+N</dt><dd>Abre una nota libre</dd><dt>Alt+M</dt><dd>Muestra la pestaña de bloques</dd><dt>?</dt><dd>Muestra esta ayuda</dd></dl><p class="muted">En Mac usa ⌘ en lugar de Ctrl y Option en lugar de Alt.</p>`;
function showKeys(welcome){const m=$("modal");m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-label="Ayuda">${welcome?`<h2>Bienvenido a Notarium ${APP_VERSION}</h2><ol class="tour"><li><b>Toca la opción</b> que quieres que quede; lo pendiente se ve en ámbar.</li><li>Arriba eliges el <b>modo</b>: Elegir, Escribir sobre el texto o Borrar.</li><li><b>Todo normal</b> completa los exámenes; tú solo marcas hallazgos.</li><li><b>Ctrl+Z</b> deshace cualquier cosa, así que equivocarse no cuesta.</li></ol><h3>Atajos</h3>`:`<h2>Atajos de teclado</h2>`}${KEYS_HTML}<div class="row"><button class="btn primary" data-close-modal>${welcome?"Empezar":"Cerrar"}</button></div></div>`;m.classList.add("show");if(welcome){Store.settings.tourDone=true;saveSettings()}m.querySelector("[data-close-modal]").focus()}
document.addEventListener("click",e=>{if(e.target.closest("[data-close-modal]")||e.target.id==="modal"){$("modal").classList.remove("show")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("modal").classList.contains("show")){$("modal").classList.remove("show");e.stopPropagation()}},true);
let CV=null;
function convStart(kind){const pe=selInPedit();if(!pe)return;const s=window.getSelection(),r=s.getRangeAt(0),fr=r.cloneContents();if(fr.querySelector&&fr.querySelector(".tok")){toast("Selecciona solo texto fijo, sin opciones ni campos.",true);return}
  const txt=s.toString().replace(/\s+/g," ").trim();if(!txt)return;CV={kind,txt,t:ctxTpl(pe),pk:pe.dataset.pk};$("selbar").classList.remove("show");
  const m=$("modal");m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true"><h2>${kind==="opt"?"Convertir en opciones":"Convertir en campo"}</h2><p class="muted">Texto seleccionado: «${esc(txt)}»</p>
  <label class="cv-l">${kind==="opt"?"Opciones separadas por una barra /":"Nombre del campo"}<input id="cvin" value="${esc(kind==="opt"?txt+" / ":txt.slice(0,30))}"></label>
  <p class="muted">Se guarda en tu versión de la plantilla «${esc((getTpl(bid(CV.t))||{}).name||"")}» para todas las notas futuras. La nota en curso de esta plantilla se reinicia.</p>
  <div class="row"><button class="btn primary" id="cvok">${kind==="opt"?"Crear opciones":"Crear campo"}</button><button class="btn" data-close-modal>Cancelar</button></div></div>`;m.classList.add("show");const i=$("cvin");i.focus();i.setSelectionRange(i.value.length,i.value.length);
  $("cvok").onclick=()=>convApply(i.value);i.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();convApply(i.value)}}}
function convApply(val){const c0=CV;if(!c0)return;const base=bid(c0.t),bt=getTpl(base),orig=TEMPLATES.find(x=>x.id===base),cur=Store.custom[base];
  let src=cur?cur.source:(orig?builtinToSource(orig):null);if(src==null||!bt){toast("No pude modificar esta plantilla.",true);return}
  const sid=c0.pk.split(":")[0],sec=bt.sections.find(s=>s.id===sid);let from=0;if(sec){const h=src.indexOf("## "+sec.title);if(h>=0)from=h}
  let idx=src.indexOf(c0.txt,from);if(idx<0)idx=src.indexOf(c0.txt);
  if(idx<0){$("modal").classList.remove("show");toast("No pude ubicar ese texto en la plantilla (quizás lo editaste en esta nota). Usa Editar plantilla.",true);return}
  let rp;if(c0.kind==="opt"){const o=val.split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);if(!o.length)return;rp="["+o.join(" / ")+"]"}else{const nm=val.replace(/[{}=\[\]]/g,"").trim();if(!nm)return;rp="{"+nm+"}"}
  src=src.slice(0,idx)+rp+src.slice(idx+c0.txt.length);
  pushHist();
  Store.custom[base]=orig?{id:base,name:cur?cur.name:orig.name,short:cur?cur.short:orig.short,group:orig.group,lang:orig.lang,source:src,updated:Date.now(),override:true}:{...cur,source:src,updated:Date.now()};
  saveCustom();delete S.notes[c0.t.id];if(c0.t.id!==base)delete S.notes[base];CV=null;$("modal").classList.remove("show");render();toast(c0.kind==="opt"?"Opciones creadas en tu plantilla":"Campo creado en tu plantilla");}
/* ---------- paleta de inserción ---------- */
const PAL={open:false};
function openPal(host,sid,idx){Object.assign(PAL,{open:true,host:host.id,sid,idx,q:"",sel:0});const m=$("pal");
  m.innerHTML=`<div class="pal-box" role="dialog" aria-label="Insertar"><input id="palq" class="search" placeholder="Buscar bloque, o elige Texto libre" autocomplete="off" aria-label="Buscar bloque"><div id="pallist" role="listbox"></div><p class="muted pal-h">Escribe para filtrar. ↑ ↓ para moverte, Enter para insertar, Esc para cerrar.</p></div>`;
  m.classList.add("show");renderPalList();$("palq").focus()}
function closePal(){PAL.open=false;$("pal").classList.remove("show")}
function palItems(){const q=norm(PAL.q.trim()),host=tplById(PAL.host),L=[{kind:"x",name:"Texto libre",group:"Escribir"}];
  const uB=Store.settings.useBlk||{};
  allTpls().filter(x=>isBlock(x)&&x.id!==host.id).sort((a,b)=>(uB[b.id]||0)-(uB[a.id]||0)).forEach(x=>L.push({kind:"b",id:x.id,name:x.name,short:x.short,group:x.group,txt:x.textOnly}));
  return q?L.filter(x=>norm(x.name+" "+(x.short||"")+" "+x.group).includes(q)):L}
function renderPalList(){const L=palItems();PAL.list=L;if(PAL.sel>=L.length)PAL.sel=0;let h="",g=null;
  L.forEach((x,i)=>{if(x.group!==g){g=x.group;h+=`<div class="pal-g">${esc(g)}</div>`}h+=`<button class="pal-it${i===PAL.sel?" on":""}" data-pi="${i}" role="option">${x.kind==="x"?"✎ ":x.txt?"¶ ":"⧉ "}${esc(x.name)}${x.short?`<span>${esc(x.short)}</span>`:""}</button>`});
  $("pallist").innerHTML=h||'<p class="empty-q">Nada coincide.</p>';const on=$("pallist").querySelector(".on");if(on)on.scrollIntoView({block:"nearest"})}
function palChoose(i){const x=PAL.list[i];if(!x)return;const host=tplById(PAL.host),sid=PAL.sid,idx=PAL.idx;closePal();if(x.kind==="x"){addText(host,sid,idx);return}bumpUse(x.id);const bt=getTpl(x.id);if(bt&&bt.textOnly)addText(host,sid,idx,textOf(bt));else addBlock(host,sid,idx,x.id)}
function bumpUse(id){const u=Store.settings.useBlk||(Store.settings.useBlk={});u[id]=(u[id]||0)+1;saveSettings()}
document.addEventListener("input",e=>{if(e.target.id!=="palq")return;e.stopImmediatePropagation();PAL.q=e.target.value;PAL.sel=0;renderPalList()},true);
document.addEventListener("click",e=>{if(!PAL.open)return;const b=e.target.closest("[data-pi]");if(b){e.stopImmediatePropagation();palChoose(+b.dataset.pi);return}if(e.target.id==="pal"){e.stopImmediatePropagation();closePal()}},true);
document.addEventListener("keydown",e=>{
  if(PAL.open){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();e.stopImmediatePropagation();const n=PAL.list.length;if(!n)return;PAL.sel=(PAL.sel+(e.key==="ArrowDown"?1:n-1))%n;renderPalList();return}
    if(e.key==="Enter"){e.preventDefault();e.stopImmediatePropagation();palChoose(PAL.sel);return}
    if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();closePal();return}
    return}
  if(S.view!=="note")return;
  const tg=e.target,typing=tg.matches&&(tg.matches("input,textarea,select")||tg.isContentEditable);
  if(e.altKey&&(e.key==="ArrowUp"||e.key==="ArrowDown")){const it=tg.closest&&tg.closest(".item");if(it){e.preventDefault();const[hid,sid,i]=it.dataset.item.split("|");itMove(tplById(hid),sid,+i,e.key==="ArrowUp"?-1:1)}return}
  if(e.key==="/"&&!typing&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const t=T();let sid=null;const secEl=tg.closest&&tg.closest("section[data-sid]");if(secEl&&secEl.closest("[data-tid]")&&secEl.closest("[data-tid]").dataset.tid===t.id)sid=secEl.dataset.sid;if(!sid){const on=t.sections.filter(s=>secOn(t,s));sid=(on[on.length-1]||t.sections[0]).id}openPal(t,sid,itemsOf(t,sid).length)}
},true);
function selInPedit(){const s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount)return null;const r=s.getRangeAt(0),a=r.commonAncestorContainer,el=a.nodeType===1?a:a.parentElement;return el&&el.closest(".pedit")}
document.addEventListener("selectionchange",()=>{const b=$("selbar");if(b)b.classList.toggle("show",!!selInPedit())});
$("selbar").addEventListener("mousedown",e=>e.preventDefault());
$("selOpt").addEventListener("click",()=>convStart("opt"));$("selFld").addEventListener("click",()=>convStart("fld"));
$("selDel").addEventListener("click",()=>{const pe=selInPedit();if(!pe)return;pushHist();document.execCommand("delete");$("selbar").classList.remove("show")});
$("q").placeholder=/Mac|iPhone|iPad/.test(navigator.platform||"")?"Buscar nota  (⌘K)":"Buscar nota  (Ctrl+K)";
if(CHANNEL==="pruebas"){const c=$("chan");c.textContent="Versión de pruebas "+APP_VERSION+". Tus plantillas y frases de la versión normal no están aquí.";c.classList.add("show")}
$("verbtn").lastChild.textContent="Respaldo y versiones ("+APP_VERSION+")";
render();
initCloud();
setTimeout(()=>{if(!Store.settings.tourDone)showKeys(true)},700);
</script>
